name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile + integration tests (Java 21, PostgreSQL via Testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify
        run: |
          set -o pipefail
          mvn -B -ntp -Dstyle.color=never verify 2>&1 | tee maven-build.log
        env:
          # GitHub hosted runners provide Docker, which Testcontainers needs for PostgreSQL.
          TESTCONTAINERS_RYUK_DISABLED: 'false'

      - name: Annotate build failure
        if: failure()
        shell: bash
        run: |
          # Surfaces the most useful lines of a failed build as check-run annotations.
          log=maven-build.log
          [ -f "$log" ] || exit 0
          mapfile -t lines < <(grep -E "\.java:\[|error:|symbol:|location:|Caused by|Tests run:.*Fail|BUILD FAILURE|ERROR\] Failed to execute" "$log" | head -n 15 | cut -c1-220)
          if [ ${#lines[@]} -eq 0 ]; then
            mapfile -t lines < <(tail -n 10 "$log")
          fi
          for line in "${lines[@]}"; do
            line="${line//[$'\r'$'\n']/ }"
            printf '::error::%s\n' "$line"
          done

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maven-build-log
          path: maven-build.log
          if-no-files-found: ignore

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports
          if-no-files-found: ignore

      - name: Upload build artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: application-jar
          path: target/*.jar
          if-no-files-found: ignore
