name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile + integration tests (Java 21, PostgreSQL via Testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Diagnostics
        run: |
          echo "IMAGE_OS=$(cat /etc/os-release | head -n 2 | tail -n 1)"
          which docker || echo "docker: missing"
          (docker info --format '{{.ServerVersion}}' 2>&1 | head -n 3) || true
          ls -l /var/run/docker.sock 2>&1 || true
          which psql || echo "psql: missing"
        continue-on-error: true

      - name: Start PostgreSQL
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql
          fi
          sudo service postgresql start || sudo systemctl start postgresql
          for attempt in $(seq 1 30); do
            if sudo -u postgres pg_isready -q; then break; fi
            sleep 2
          done
          sudo -u postgres psql -v ON_ERROR_STOP=1 -tc "SELECT 1 FROM pg_roles WHERE rolname='sportsweb'" | grep -q 1 \
            || sudo -u postgres psql -v ON_ERROR_STOP=1 -c "CREATE ROLE sportsweb LOGIN PASSWORD 'sportsweb' SUPERUSER"
          sudo -u postgres psql -v ON_ERROR_STOP=1 -tc "SELECT 1 FROM pg_database WHERE datname='sportsweb'" | grep -q 1 \
            || sudo -u postgres psql -v ON_ERROR_STOP=1 -c "CREATE DATABASE sportsweb OWNER sportsweb"
          PGPASSWORD=sportsweb psql -h 127.0.0.1 -U sportsweb -d sportsweb -c "select current_database(), version();"

      - name: Verify
        run: |
          set -o pipefail
          mvn -B -ntp -Dstyle.color=never -Dtest.database.external=true verify 2>&1 | tee maven-build.log
        env:
          # The suite runs against the PostgreSQL instance started above instead of Docker.
          SPRING_DATASOURCE_URL: jdbc:postgresql://127.0.0.1:5432/sportsweb
          SPRING_DATASOURCE_USERNAME: sportsweb
          SPRING_DATASOURCE_PASSWORD: sportsweb
          TESTCONTAINERS_RYUK_DISABLED: 'false'

      - name: Annotate build failure
        if: failure()
        shell: bash
        run: |
          # Surfaces the most useful lines of a failed build as check-run annotations.
          log=maven-build.log
          [ -f "$log" ] || exit 0
          mapfile -t lines < <(grep -E "\.java:\[|error:|symbol:|location:|Caused by|Tests run:.*Fail|BUILD FAILURE|ERROR\] Failed to execute" "$log" | head -n 15 | cut -c1-220)
          if [ ${#lines[@]} -eq 0 ]; then
            mapfile -t lines < <(tail -n 10 "$log")
          fi
          for line in "${lines[@]}"; do
            line="${line//[$'\r'$'\n']/ }"
            printf '::error::%s\n' "$line"
          done

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maven-build-log
          path: maven-build.log
          if-no-files-found: ignore

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports
          if-no-files-found: ignore

      - name: Upload build artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: application-jar
          path: target/*.jar
          if-no-files-found: ignore
