# Local development stack. Values come from .env (see .env.example).
# Both secrets are mandatory: compose fails fast instead of defaulting to a known value.
services:
  postgres:
    image: postgres:16-alpine
    container_name: sports-web-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-sportsweb}
      POSTGRES_USER: ${DB_USERNAME:-sportsweb}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-sportsweb} -d ${DB_NAME:-sportsweb}"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build:
      context: .
    container_name: sports-web-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-sportsweb}
      DB_USERNAME: ${DB_USERNAME:-sportsweb}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      APP_JWT_SECRET: ${APP_JWT_SECRET:?set APP_JWT_SECRET in .env}
      APP_JWT_ISSUER: ${APP_JWT_ISSUER:-sports-web-backend}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      APP_PUBLIC_SITE_BASE_URL: ${APP_PUBLIC_SITE_BASE_URL:-http://localhost:3000}
      APP_ARTICLE_PATH_TEMPLATE: ${APP_ARTICLE_PATH_TEMPLATE:-/news/{slug}}
      APP_PUBLIC_SITE_LANGUAGE: ${APP_PUBLIC_SITE_LANGUAGE:-en}
      APP_DOCS_PUBLIC: ${APP_DOCS_PUBLIC:-true}
      # Opt-in demo content: set APP_FLYWAY_LOCATIONS=classpath:db/migration,classpath:db/demo in .env
      SPRING_FLYWAY_LOCATIONS: ${APP_FLYWAY_LOCATIONS:-classpath:db/migration}
      APP_BOOTSTRAP_ENABLED: ${APP_BOOTSTRAP_ENABLED:-false}
      APP_BOOTSTRAP_ADMIN_EMAIL: ${APP_BOOTSTRAP_ADMIN_EMAIL:-}
      APP_BOOTSTRAP_ADMIN_PASSWORD: ${APP_BOOTSTRAP_ADMIN_PASSWORD:-}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  pgdata:
