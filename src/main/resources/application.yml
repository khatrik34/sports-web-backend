# Base configuration. Every environment-specific value comes from an environment
# variable; nothing secret or environment-specific is committed here.
spring:
  application:
    name: sports-web-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sportsweb}
    username: ${DB_USERNAME:sportsweb}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      pool-name: sports-web-pool

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema. "validate" makes the application fail fast if an entity
      # and a migration disagree. Override with JPA_DDL_AUTO only for local experiments.
      ddl-auto: ${JPA_DDL_AUTO:validate}
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

  mvc:
    problemdetails:
      enabled: true

  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
  # Never leak exception messages or stack traces to clients.
  error:
    include-message: never
    include-stacktrace: never
    include-exception: false
  compression:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

app:
  security:
    jwt:
      # REQUIRED. Base64 encoded HMAC key, at least 32 bytes decoded.
      # Generate with: openssl rand -base64 48
      secret: ${APP_JWT_SECRET:}
      issuer: ${APP_JWT_ISSUER:sports-web-backend}
      access-token-ttl: ${APP_ACCESS_TOKEN_TTL:PT15M}
      refresh-token-ttl: ${APP_REFRESH_TOKEN_TTL:P14D}
    cors:
      allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
      allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
      max-age: PT1H
    docs:
      # Swagger UI / OpenAPI JSON are convenient in development; set APP_DOCS_PUBLIC=false
      # in production so the API surface is not advertised publicly.
      public-access: ${APP_DOCS_PUBLIC:true}
    login:
      max-failed-attempts: ${APP_LOGIN_MAX_FAILED_ATTEMPTS:5}
      lockout-duration: ${APP_LOGIN_LOCKOUT_DURATION:PT15M}
  public-site:
    # Used when building absolute URLs and canonical links for the public API.
    base-url: ${APP_PUBLIC_SITE_BASE_URL:http://localhost:3000}
    # Article path shape of the existing website (verified: /news/{slug}).
    # {slug} is always substituted; {categorySlug} is supported but not part of the real URL.
    article-path-template: ${APP_ARTICLE_PATH_TEMPLATE:/news/{slug}}
    # Language reported by the news sitemap feed.
    language: ${APP_PUBLIC_SITE_LANGUAGE:en}
  bootstrap:
    # Opt-in creation of the very first administrator. No user rows are seeded by Flyway.
    enabled: ${APP_BOOTSTRAP_ENABLED:false}
    admin-email: ${APP_BOOTSTRAP_ADMIN_EMAIL:}
    admin-password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:}
    admin-display-name: ${APP_BOOTSTRAP_ADMIN_DISPLAY_NAME:Site Administrator}

logging:
  level:
    root: INFO
    com.sportsweb.backend: INFO
